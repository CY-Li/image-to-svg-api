    <style>
        :root {
            --font-primary: 'Noto Sans TC', 'Roboto', sans-serif;
            --font-size-base: 16px;
            --font-size-sm: 0.875rem;
            --font-size-lg: 1.125rem;

        }
        .header-content {
            max-width: 1200px;

            display: flex;
            justify-content: space-between;

        .logo {

            text-decoration: none;

        .logo img {
            height: 40px;
            width: 160px;
            max-width: 100%;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-links a {
            color: #4b5563;
            text-decoration: none;
            font-weight: var(--font-weight-medium);
            transition: color 0.2s;
            font-size: var(--font-size-base);
        }
        .nav-links a:hover {
            color: #4f46e5;
        }
        .nav-links a.active {
            color: #4f46e5;
            font-weight: var(--font-weight-semibold);
        }
        /* Dropdown Styles */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #fff;
            min-width: 160px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 0.5rem 0;
            z-index: 1;
            font-size: 0.95rem;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown-content a {
            color: #4b5563;
            padding: 0.5rem 1rem;
            text-decoration: none;
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .dropdown-content a:hover {
            background-color: #f3f4f6;
            color: #4f46e5;
        }
        .dropdown-content a.active {
            background-color: #eef2ff;
            color: #4f46e5;
            font-weight: 600;
        }
        .dropdown-btn {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
        }
        .dropdown-btn::after {
            content: '';
            display: inline-block;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 4px solid #4b5563;
            margin-left: 4px;
            transition: transform 0.2s;
        }
        .dropdown:hover .dropdown-btn::after {
            transform: rotate(180deg);
        }
        @media (max-width: 640px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            .nav-links {
                flex-direction: column;
                gap: 0.5rem;
            }
            .dropdown-content {
                position: static;
                box-shadow: none;
                padding-left: 1rem;
            }
        }
        .drop-zone {
            border: 2px dashed #e5e7eb;
            transition: all 0.3s ease;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }
        .material-card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

<body>
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src="public/logo.png" alt="Logo" class="h-10 w-40 mr-2 inline-block align-middle">
                </a>
                <nav class="nav-links">
                    <a href="index.html">首頁</a>
                    <div class="dropdown">
                        <div class="dropdown-btn">功能</div>
                        <div class="dropdown-content">
                            <a href="tosvg.html">圖片轉SVG格式</a>
                            <a href="logogenerator.html">AI Logo 產生器</a>
                            <a href="fileconverter.html" class="active">文件格式轉換</a>
                        </div>
                    </div>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-6 py-8 mt-16">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Left Column: File Upload -->
                <div class="bg-white rounded-xl material-card-shadow p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6">上傳檔案</h2>
                    
                    <!-- File Upload Zone -->
                    <div class="drop-zone rounded-lg p-8 text-center mb-6 cursor-pointer">
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt">
                        <div class="flex flex-col items-center">
                            <span class="material-icons text-4xl text-indigo-600 mb-3">cloud_upload</span>
                            <p class="text-gray-600 mb-2">拖放檔案到這裡或點擊上傳</p>
                            <p class="text-sm text-gray-500">支援 PDF、Word、Excel、TXT 等格式</p>
                        </div>
                    </div>

                    <!-- File Info -->
                    <div id="fileInfo" class="hidden">
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <span class="material-icons text-gray-600 mr-3">description</span>
                                <div>
                                    <p id="fileName" class="font-medium text-gray-800"></p>
                                    <p id="fileSize" class="text-sm text-gray-500"></p>
                                </div>
                            </div>
                            <button id="removeFile" class="text-gray-500 hover:text-red-500">
                                <span class="material-icons">close</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Conversion Options -->
                <div class="bg-white rounded-xl material-card-shadow p-6">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-6">轉換選項</h2>
                    
                    <!-- Conversion Options -->
                    <div id="conversionOptions" class="hidden">
                        <div class="space-y-4">
                            <!-- PDF Options -->
                            <div class="p-4 bg-gray-50 rounded-lg">
                                <h3 class="font-medium text-gray-800 mb-3">轉換為 PDF</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <button class="flex items-center justify-center p-3 bg-white rounded-lg border hover:border-indigo-500 hover:text-indigo-600 transition-colors">
                                        <span class="material-icons mr-2">picture_as_pdf</span>
                                        PDF
                                    </button>
                                </div>
                            </div>

                            <!-- Word Options -->
                            <div class="p-4 bg-gray-50 rounded-lg">
                                <h3 class="font-medium text-gray-800 mb-3">轉換為 Word</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <button class="flex items-center justify-center p-3 bg-white rounded-lg border hover:border-indigo-500 hover:text-indigo-600 transition-colors">
                                        <span class="material-icons mr-2">description</span>
                                        DOCX
                                    </button>
                                    <button class="flex items-center justify-center p-3 bg-white rounded-lg border hover:border-indigo-500 hover:text-indigo-600 transition-colors">
                                        <span class="material-icons mr-2">description</span>
                                        DOC
                                    </button>
                                </div>
                            </div>

                            <!-- Excel Options -->
                            <div class="p-4 bg-gray-50 rounded-lg">
                                <h3 class="font-medium text-gray-800 mb-3">轉換為 Excel</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <button class="flex items-center justify-center p-3 bg-white rounded-lg border hover:border-indigo-500 hover:text-indigo-600 transition-colors">
                                        <span class="material-icons mr-2">table_chart</span>
                                        XLSX
                                    </button>
                                    <button class="flex items-center justify-center p-3 bg-white rounded-lg border hover:border-indigo-500 hover:text-indigo-600 transition-colors">
                                        <span class="material-icons mr-2">table_chart</span>
                                        XLS
                                    </button>
                                </div>
                            </div>

                            <!-- Text Options -->
                            <div class="p-4 bg-gray-50 rounded-lg">
                                <h3 class="font-medium text-gray-800 mb-3">轉換為文字檔</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <button class="flex items-center justify-center p-3 bg-white rounded-lg border hover:border-indigo-500 hover:text-indigo-600 transition-colors">
                                        <span class="material-icons mr-2">article</span>
                                        TXT
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- No File Uploaded Message -->
                    <div id="noFileMessage" class="text-center py-12">
                        <span class="material-icons text-6xl text-gray-300 mb-4">upload_file</span>
                        <p class="text-gray-500">請先上傳檔案以查看轉換選項</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 text-white py-6 mt-auto">
            <div class="container mx-auto px-6 text-center">
                <p>&copy; 2025 Invisio.AI. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script>
        // File Upload Handling
        const dropZone = document.querySelector('.drop-zone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFile = document.getElementById('removeFile');
        const conversionOptions = document.getElementById('conversionOptions');
        const noFileMessage = document.getElementById('noFileMessage');

        let currentFile = null;

        // Handle drag and drop events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        // Handle file drop
        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        // Handle file selection
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                currentFile = file;
                displayFileInfo(file);
                showConversionOptions();
            }
        }

        function displayFileInfo(file) {
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.remove('hidden');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showConversionOptions() {
            conversionOptions.classList.remove('hidden');
            noFileMessage.classList.add('hidden');
        }

        // Remove file
        removeFile.addEventListener('click', () => {
            fileInput.value = '';
            currentFile = null;
            fileInfo.classList.add('hidden');
            conversionOptions.classList.add('hidden');
            noFileMessage.classList.remove('hidden');
        });

        // Handle conversion
        document.querySelectorAll('#conversionOptions button').forEach(button => {
            button.addEventListener('click', async () => {
                if (!currentFile) return;

                const targetFormat = button.textContent.trim().toLowerCase();
                const formData = new FormData();
                formData.append('file', currentFile);
                formData.append('targetFormat', targetFormat);

                try {
                    button.disabled = true;
                    button.innerHTML = '<span class="material-icons animate-spin">sync</span> 轉換中...';

                    const response = await fetch('/api/convert', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error('轉換失敗');
                    }

                    // 獲取檔案名稱
                    const contentDisposition = response.headers.get('content-disposition');
                    const filename = contentDisposition
                        ? contentDisposition.split('filename=')[1].replace(/"/g, '')
                        : `converted.${targetFormat}`;

                    // 下載檔案
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    // 顯示成功訊息
                    showNotification('轉換成功！', 'success');
                } catch (error) {
                    console.error('轉換錯誤:', error);
                    showNotification('轉換失敗，請稍後再試', 'error');
                } finally {
                    button.disabled = false;
                    button.innerHTML = `<span class="material-icons mr-2">${getIconForFormat(targetFormat)}</span> ${targetFormat.toUpperCase()}`;
                }
            });
        });

        function getIconForFormat(format) {
            const icons = {
                'pdf': 'picture_as_pdf',
                'docx': 'description',
                'doc': 'description',
                'xlsx': 'table_chart',
                'xls': 'table_chart',
                'txt': 'article'
            };
            return icons[format] || 'description';
        }

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed bottom-4 right-4 p-4 rounded-lg shadow-lg ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            } text-white`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
